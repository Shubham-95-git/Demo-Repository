<template>
    <lightning-card title="Related Contacts" icon-name="standard:contact">
        <!-- Search Input -->
        <div class="slds-p-around_medium">
            <lightning-input
                type="search"
                label="Search Contact"
                placeholder="Search by Name"
                value={searchTerm}
                onchange={handleSearchChange}>
            </lightning-input>
        </div>
        <template if:true={isSearching}>
            <div class="slds-p-around_medium">
                <lightning-spinner
                    alternative-text="Searching..."
                    size="small">
                </lightning-spinner>
            </div>
        </template>
        <template if:true={contacts}>
            <lightning-datatable
                key-field="Id"
                data={contacts}
                columns={columns}
                hide-checkbox-column
                onrowaction={handleRowAction}>
            </lightning-datatable>
        </template>
        <!-- No Records Message -->
        <template if:true={showNoRecords}>
            <div class="slds-p-around_medium slds-text-align_center">
                No contacts found
            </div>
        </template>
        <!-- Modal Popup Starts here -->
        <template if:true={isModal}>
            <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <!-- Header -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading" class="slds-text-heading_medium">Edit Contact</h2>
                    </header>
                    <!-- Body -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-record-edit-form object-api-name="Contact" record-id={selectedId} onsuccess={handleSuccess} onerror={handleError}>

                            <lightning-messages></lightning-messages>

                            <lightning-input-field field-name="FirstName"></lightning-input-field>

                            <lightning-input-field field-name="LastName"></lightning-input-field>

                            <lightning-input-field field-name="Email"></lightning-input-field>

                            <lightning-input-field field-name="Phone"></lightning-input-field>

                            <div class="slds-m-top_medium">
                                <lightning-button label="Cancel" onclick={closeModal}></lightning-button>

                                <lightning-button class="slds-m-left_small" variant="brand" type="submit" label="Save"></lightning-button>
                            </div>
                        </lightning-record-edit-form>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
